<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Snow · Demo</title>
  <link rel="stylesheet" href="snow.css">
  <script src="snow.js" defer></script>
  <style>
    *{box-sizing:border-box}
    :root{font-family:system-ui,sans-serif;color-scheme:dark;background:#161719;color:#f4f4f5}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
    button{appearance:none;font:inherit;cursor:pointer;border:1px solid transparent;color:inherit;border-radius:6px}
    button:focus-visible{outline:2px solid #b5b5bd;outline-offset:3px}
    button:disabled{opacity:.4;cursor:default}
    .primary{background:#f2f2f3;color:#171719;font-size:14px;font-weight:650;min-height:44px;padding:12px 20px}
    .primary:active{background:#d5d5d8}
    dialog{position:fixed;inset:0;margin:auto;width:min(420px,calc(100% - 32px));max-width:none;max-height:calc(100dvh - 32px);padding:0;border:1px solid #ffffff26;border-radius:12px;background:#242528;color:#f4f4f5;overflow:hidden;box-shadow:0 18px 60px #0005}
    dialog::backdrop{background:#000a}
    .surface{position:relative;z-index:1;max-height:calc(100dvh - 34px);overflow:auto;padding:28px;display:grid;gap:24px;scrollbar-width:thin}
    .heading{display:grid;justify-items:start;text-align:left;gap:10px}
    .symbol{display:grid;place-items:center;width:44px;height:44px;color:#e5e5e8;margin-bottom:6px}
    .symbol svg{width:40px;height:40px}
    h1{font-size:28px;line-height:1.12;font-weight:650;letter-spacing:-.045em;margin:0}
    p{font-size:14px;line-height:1.5;color:#aeb0b7;margin:0}
    .settings{display:grid;border-block:1px solid #ffffff1c}
    .setting{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:12px;width:100%;min-height:48px;padding:12px 0;background:transparent;border:0;border-radius:0;font-size:14px;font-weight:500}
    .switch{flex:none;width:16px;height:16px;border:1px solid #92949b;border-radius:3px;display:grid;place-items:center;color:#242528}
    .switch::after{content:"";width:8px;height:5px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);opacity:0;margin-top:-2px}
    [aria-pressed="true"] .switch{background:#ededf0;border-color:#ededf0}
    [aria-pressed="true"] .switch::after{opacity:1}
    .surface>.primary{width:100%}
    @media(hover:hover){.primary:hover{background:#dedee2}.setting:not(:disabled):hover{color:#fff;background:#ffffff06}}
    @media(max-width:340px){.surface{padding:20px;gap:20px}.heading h1{font-size:25px}}
  </style>
</head>
<body>
  <button id="open" class="primary" type="button">Abrir popup</button>
  <dialog id="popup" class="snow" aria-labelledby="popup-title" aria-describedby="popup-description">
    <div class="surface">
      <div class="heading">
        <div class="symbol" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 4v32M6.14 12l27.72 16M6.14 28l27.72-16M15 8l5 5 5-5M15 32l5-5 5 5M6.6 18.3l6.8-1.8-1.8-6.8M28.4 30.3l-1.8-6.8 6.8-1.8M6.6 21.7l6.8 1.8-1.8 6.8M28.4 9.7l-1.8 6.8 6.8 1.8"/>
          </svg>
        </div>
        <h1 id="popup-title">Felices fiestas</h1>
        <p id="popup-description">Un poco de nieve para celebrar.</p>
      </div>
      <div class="settings">
        <button id="snow-toggle" class="setting" type="button" aria-label="Nieve" aria-pressed="true">
          <span id="snow-label">Apagar nieve</span><span class="switch" aria-hidden="true"></span>
        </button>
      </div>
      <button id="close" class="primary" type="button" autofocus>Continuar</button>
    </div>
  </dialog>
  <script>
    const popup = document.getElementById("popup");
    const opener = document.getElementById("open");
    const snowToggle = document.getElementById("snow-toggle");
    const snowLabel = document.getElementById("snow-label");
    opener.addEventListener("click", () => { if (!popup.open) popup.showModal(); });
    document.getElementById("close").addEventListener("click", () => popup.close());
    snowToggle.addEventListener("click", () => {
      if (!window.SnowEffect) return;
      const enabled = !popup.classList.contains("snow");
      if (enabled) window.SnowEffect.mount(popup);
      else window.SnowEffect.unmount(popup);
      snowLabel.textContent = enabled ? "Apagar nieve" : "Encender nieve";
      snowToggle.setAttribute("aria-pressed", String(enabled));
    });
    popup.addEventListener("close", () => opener.focus());
    popup.showModal();
  </script>
</body>
</html>
