<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Snow · Demo</title>
  <link rel="stylesheet" href="snow.css">
  <script src="snow.js" defer></script>
  <style>
    *{box-sizing:border-box}
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color-scheme:dark;background:#161618;color:#f5f5f7}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
    button{appearance:none;border:0;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible{outline:3px solid #9acaff;outline-offset:3px}
    button:disabled{opacity:.38;cursor:default}
    .primary{background:#007aff;color:white;font-size:15px;font-weight:600;border-radius:12px;min-height:48px;padding:12px 22px}
    .primary:active{background:#0069db}
    dialog{position:fixed;inset:0;margin:auto;width:min(390px,calc(100% - 32px));max-width:none;max-height:calc(100dvh - 32px);padding:0;border:1px solid #ffffff18;border-radius:26px;background:#252527;color:#f5f5f7;overflow:hidden;box-shadow:0 20px 80px #0006;--snow-z-index:1}
    dialog::backdrop{background:#000a}
    .surface{position:relative;z-index:2;max-height:calc(100dvh - 34px);overflow:auto;padding:32px 24px 24px;display:grid;gap:24px;scrollbar-width:thin}
    .heading{display:grid;justify-items:center;text-align:center;gap:8px;padding:4px 0 0}
    .symbol{display:grid;place-items:center;width:64px;height:64px;border-radius:19px;background:#34383f;color:#d5eaff;margin-bottom:8px}
    .symbol svg{width:36px;height:36px}
    h1{font-size:25px;line-height:1.16;font-weight:650;letter-spacing:-.035em;margin:0}
    p{font-size:14px;line-height:1.5;color:#b8b8bd;margin:0}
    .settings{display:grid;background:#303033;border-radius:14px;overflow:hidden}
    .setting{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:16px;width:100%;min-height:54px;padding:12px 15px;background:transparent;font-size:14px;font-weight:500}
    .setting+.setting{border-top:1px solid #ffffff12}
    .switch{flex:none;width:42px;height:25px;padding:3px;border-radius:20px;background:#55555b;display:flex;align-items:center;transition:background .18s ease}
    .switch::after{content:"";width:19px;height:19px;border-radius:50%;background:white;box-shadow:0 1px 3px #0003;transform:translateX(0);transition:transform .18s ease}
    [aria-pressed="true"] .switch{background:#30a85b}
    [aria-pressed="true"] .switch::after{transform:translateX(17px)}
    .chevron{flex:none;width:7px;height:7px;border-top:1.5px solid #a1a1a6;border-right:1.5px solid #a1a1a6;transform:rotate(45deg);margin-right:4px}
    .setting:focus-visible{outline-offset:-3px}
    .surface>.primary{width:100%}
    @media(hover:hover){.primary:hover{background:#0a72e8}.setting:not(:disabled):hover{background:#ffffff08}}
    @media(max-width:340px){.surface{padding:24px 18px 18px;gap:20px}.setting{padding-inline:12px}}
    @media(prefers-reduced-motion:reduce){.switch,.switch::after{transition:none}}
  </style>
</head>
<body>
  <button id="open" class="primary" type="button">Abrir popup</button>
  <dialog id="popup" class="snow" aria-labelledby="popup-title" aria-describedby="popup-description">
    <div class="surface">
      <div class="heading">
        <div class="symbol" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 4v32M6.14 12l27.72 16M6.14 28l27.72-16M15 8l5 5 5-5M15 32l5-5 5 5M6.6 18.3l6.8-1.8-1.8-6.8M28.4 30.3l-1.8-6.8 6.8-1.8M6.6 21.7l6.8 1.8-1.8 6.8M28.4 9.7l-1.8 6.8 6.8 1.8"/>
          </svg>
        </div>
        <h1 id="popup-title">Felices fiestas</h1>
        <p id="popup-description">Un poco de nieve para celebrar.</p>
      </div>
      <div class="settings">
        <button id="snow-toggle" class="setting" type="button" aria-label="Nieve" aria-pressed="true">
          <span id="snow-label">Apagar nieve</span><span class="switch" aria-hidden="true"></span>
        </button>
        <button id="tilt" class="setting" type="button">
          <span>Activar inclinación</span><span class="chevron" aria-hidden="true"></span>
        </button>
      </div>
      <button id="close" class="primary" type="button" autofocus>Continuar</button>
    </div>
  </dialog>
  <script>
    const popup = document.getElementById("popup");
    const opener = document.getElementById("open");
    const snowToggle = document.getElementById("snow-toggle");
    const snowLabel = document.getElementById("snow-label");
    const tilt = document.getElementById("tilt");
    opener.addEventListener("click", () => { if (!popup.open) popup.showModal(); });
    document.getElementById("close").addEventListener("click", () => popup.close());
    tilt.addEventListener("click", () => window.SnowEffect?.requestMotion(popup));
    snowToggle.addEventListener("click", () => {
      if (!window.SnowEffect) return;
      const enabled = !popup.classList.contains("snow");
      if (enabled) window.SnowEffect.mount(popup);
      else window.SnowEffect.unmount(popup);
      snowLabel.textContent = enabled ? "Apagar nieve" : "Encender nieve";
      snowToggle.setAttribute("aria-pressed", String(enabled));
      tilt.disabled = !enabled;
    });
    popup.addEventListener("close", () => opener.focus());
    popup.showModal();
  </script>
</body>
</html>
