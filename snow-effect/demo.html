<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nieve · Demo independiente</title>
  <link rel="stylesheet" href="snow.css">
  <script src="snow.js" defer></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#15171b;color:#fff;font:16px/1.5 system-ui,sans-serif}
    button{font:inherit;color:#fff;background:#343b46;border:1px solid #777;border-radius:6px;padding:10px 18px;cursor:pointer}
    button:focus-visible{outline:2px solid #fff;outline-offset:3px}
    dialog{position:fixed;width:min(480px,calc(100% - 40px));border:1px solid #ffffff35;border-radius:16px;background:linear-gradient(150deg,#23334d,#090d15);color:#fff;padding:32px;box-shadow:0 20px 80px #0008}
    dialog::backdrop{background:#0009}
    h1{font-size:32px;line-height:1.1;margin:0 0 16px;letter-spacing:-.04em}
    p{color:#d1d5db;margin:0 0 24px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
  </style>
</head>
<body>
  <button id="open" type="button">Abrir popup</button>
  <dialog id="popup" class="snow-effect">
    <h1>Nieve en el popup</h1>
    <p>El canvas se adapta al tamaño de este elemento y no bloquea la interacción.</p>
    <div class="actions">
      <button id="close" type="button">Cerrar</button>
      <button id="tilt" type="button">Activar inclinación</button>
    </div>
  </dialog>
  <script>
    const popup = document.getElementById("popup");
    document.getElementById("open").onclick = () => popup.showModal();
    document.getElementById("close").onclick = () => popup.close();
    document.getElementById("tilt").onclick = () => window.SnowEffect?.requestMotion(popup);
    popup.showModal();
  </script>
</body>
</html>
