<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Let’s Celebrate · SushiClub</title>
  <link rel="preload" href="../../fonts/Gazzetta Black.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="reel-filters" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="reel-blur-0" x="-20%" y="-90%" width="140%" height="280%" color-interpolation-filters="sRGB"><feGaussianBlur id="reel-blur-amount-0" stdDeviation="0 0"/></filter>
      <filter id="reel-blur-1" x="-20%" y="-90%" width="140%" height="280%" color-interpolation-filters="sRGB"><feGaussianBlur id="reel-blur-amount-1" stdDeviation="0 0"/></filter>
      <filter id="reel-blur-2" x="-20%" y="-90%" width="140%" height="280%" color-interpolation-filters="sRGB"><feGaussianBlur id="reel-blur-amount-2" stdDeviation="0 0"/></filter>
      <filter id="reel-blur-3" x="-20%" y="-90%" width="140%" height="280%" color-interpolation-filters="sRGB"><feGaussianBlur id="reel-blur-amount-3" stdDeviation="0 0"/></filter>
    </defs>
  </svg>
  <main class="loading" aria-label="Aniversario SushiClub">
    <h1 class="year">
      <span class="sr-only" id="year-label">2001</span>
      <span class="year__wheels" aria-hidden="true">
        <span class="wheel" style="--i:0" data-start="2" data-end="2"><span class="wheel__static">2</span><span class="wheel__drum"></span></span>
        <span class="wheel" style="--i:1" data-start="0" data-end="0"><span class="wheel__static">0</span><span class="wheel__drum"></span></span>
        <span class="wheel" style="--i:2" data-start="0" data-end="2"><span class="wheel__static">0</span><span class="wheel__drum"></span></span>
        <span class="wheel" style="--i:3" data-start="1" data-end="6"><span class="wheel__static">1</span><span class="wheel__drum"></span></span>
      </span>
    </h1>
  </main>
</body>
</html>
