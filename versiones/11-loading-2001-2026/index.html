<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Let’s Celebrate · SushiClub</title>
  <link rel="preload" href="../../fonts/Gazzetta Black.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="loading" aria-label="Aniversario SushiClub">
    <h1 class="year">
      <span class="sr-only" id="year-label">2001</span>
      <span class="year__wheels" aria-hidden="true">
        <span class="wheel" style="--i:0" data-start="2" data-end="2"><span class="wheel__static">2</span></span>
        <span class="wheel" style="--i:1" data-start="0" data-end="0"><span class="wheel__static">0</span></span>
        <span class="wheel" style="--i:2" data-start="0" data-end="2"><span class="wheel__static">0</span></span>
        <span class="wheel" style="--i:3" data-start="1" data-end="6"><span class="wheel__static">1</span></span>
        <canvas class="year__cylinder" id="cylinder-canvas" aria-hidden="true"></canvas>
      </span>
    </h1>
    <div class="loading__progress" id="loading-progress" role="progressbar" aria-label="Progreso de la apertura" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="loading__progress-fill" id="loading-progress-fill"></span>
    </div>
  </main>
</body>
</html>
